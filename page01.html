<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&family=Monomaniac+One&display=swap" rel="stylesheet">
    <!-- TailwindCSS ด้วยวิธี CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ตั้งค่า Google Font และสี ใช้กับ TailwindCSS -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        itim: ["Itim"],
                        monomaniac: ["Monomaniac One", "sans-serif"],
                    },
                    colors: {
                        mint: "rgb(0, 252, 210)",
                    },
                },
            },
        };
    </script>
</head>

<body class="bg-black m-2 leading-[normal]">
    <div class="w-full">
        <!-- ส่วนของ navbar -->
        <div class="flex items-center justify-center my-[30px] mx-[80px]">
            <!-- เมนูต่างๆ ชิดซ้าย-->
            <div class="w-full flex gap-[30px]">
                <a href="#" class="text-white text-[1.5rem] font-monomaniac no-underline hover:text-mint">Portfolio</a>
                <a href="#" class="text-white text-[1.5rem] font-monomaniac no-underline hover:text-mint">About Me</a>
                <a href="#" class="text-white text-[1.5rem] font-monomaniac no-underline hover:text-mint">Get In Touch</a>
            </div>
            <!-- ข้อความ Hello อยู่ตรงกลาง-->
            <div class="w-full text-center">
                <span class="text-mint font-itim text-[3.5rem] italic">hello</span>
            </div>
            <!-- ไอคอนต่างๆ ชิดขวา-->
            <div class="w-full flex justify-end gap-[30px]">
                <i class="bi bi-github text-white text-[1.5rem] hover:text-mint"></i>
                <i class="bi bi-instagram text-white text-[1.5rem] hover:text-mint"></i>
                <i class="bi bi-twitter text-white text-[1.5rem] hover:text-mint"></i>
                <i class="bi bi-linkedin text-white text-[1.5rem] hover:text-mint"></i>
            </div>
        </div>

        <!-- ส่วนของ personal info -->
        <!-- 1rem = 16px -->
        <div class="flex flex-col items-center mt-[100px]">
            <span class="flex flex-col items-center text-white font-monomaniac text-[2.5rem]">6819M10001</span>
            <span class="flex flex-col items-center text-white font-monomaniac text-[2.5rem]">Busakol Watronchai</span>
            <span class="flex flex-col items-center text-mint font-monomaniac text-[2.5rem]">Freelance Web Developer</span>
            <span class="flex flex-col items-center text-white font-monomaniac text-[2.5rem]">Based In THAILAND</span>
        </div>

        <!-- ส่วนของ personal picture -->
        <div class="mt-[150px] flex justify-center">
            <img class="w-[300px] h-[300px] object-cover rounded-full border-[5px] border-mint p-[15px] box-content"
                src="./images/person.jpg" alt="person">
        </div>
    </div>
</body>

</html>
